<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 壁纸层 -->
<div class="wallpaper" id="wallpaper"></div>
<div class="wallpaper-scrim"></div>

<div class="app">

  <!-- 顶部信息：不套卡片，直接浮在壁纸上（Edge 新标签页风格） -->
  <header class="topbar">
    <div class="brand">
      <img class="logo" id="brandIcon" src="/static/favicon.svg" alt="">
      <span class="date-line">
        <span id="dateText">加载中</span>
        <span class="weekday" id="weekday"></span>
        <span class="festival-chip" id="festivalChip" hidden></span>
      </span>
      <span class="clock" id="clock">--:--:--</span>
    </div>

    <div class="top-actions">
      <span class="wx-inline" id="wxInline" hidden>
        <span class="wx-icon" id="wxIcon"></span>
        <span class="wx-city" id="wxCity"></span>
        <span class="wx-temp" id="wxTemp"></span>
      </span>
      <span class="wx-sep" id="wxSep" hidden></span>
      <button class="iconbtn" data-act="refresh" title="刷新天气、壁纸与简报">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
      </button>
      <button class="iconbtn" data-act="nextPhoto" title="换壁纸（N）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>
      </button>
      <button class="iconbtn" data-act="theme" title="切换配色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="iconbtn" data-act="settings" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v0a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="iconbtn" data-act="quit" title="退出工作台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v8"/><path d="M18.4 7.6a8.5 8.5 0 1 1-12.8 0"/></svg>
      </button>
    </div>
  </header>

  <main class="grid">

    <!-- 左：快捷启动 -->
    <section class="col left">
      <div class="col-head"><h2>快捷启动</h2></div>
      <div id="launchers" class="launchers"></div>
    </section>

    <!-- 中：浮在壁纸上的每日一句 -->
    <section class="col mid">
      <div class="mid-spacer"></div>
      <div class="quote-float">
        <div class="quote" id="quote">正在准备今天的一句话…</div>
        <div class="quote-from" id="quoteFrom"></div>
      </div>
    </section>

    <!-- 右：今日简报 + 待办 + 节日（嵌入） -->
    <aside class="col right">
      <div class="card glass news-card">
        <div class="card-head">
          <span>今日简报</span>
          <span class="pill" id="newsMeta">—</span>
        </div>
        <div class="items" id="newsItems" tabindex="0"></div>
        <div class="items-foot">
          <span class="items-hint">滚轮翻</span>
          <span class="items-pos" id="itemsPos">—</span>
        </div>
      </div>

      <div class="card glass todo-card">
        <div class="card-head">
          <span>待办</span>
          <span class="pill" id="todoMeta">—</span>
        </div>
        <div class="todo-input">
          <input id="todoInput" type="text" placeholder="写一条，回车添加" maxlength="120">
          <button class="mini" data-act="todoAdd">加</button>
        </div>
        <div class="todos" id="todos"></div>
      </div>

      <div class="col-spacer"></div>
      <div class="festival-embed" id="festivalOne" hidden></div>
    </aside>

  </main>

  <footer class="statusbar">
    <span id="statusNote">就绪</span>
    <span class="dot" id="statusDot"></span>
    <span class="spacer"></span>
    <span id="statusMeta"></span>
  </footer>
</div>

<!-- 壁纸署名 -->
<div class="wall-credit" id="wallCredit"></div>

<div class="toast-wrap" id="toastWrap"></div>

<!-- ===================== 二级页面：条目简述 ===================== -->
<div class="drawer-mask" id="drawerMask" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header class="drawer-head">
    <div class="drawer-top">
      <span class="drawer-cat" id="dCat"></span>
      <span class="drawer-idx" id="dIdx"></span>
      <span class="spacer"></span>
      <button class="btn ghost" data-act="closeDrawer">关闭 ✕</button>
    </div>
    <h2 class="drawer-title" id="dTitle"></h2>
    <div class="drawer-meta"><span id="dMeta"></span></div>
  </header>

  <div class="drawer-body">
    <div class="dsec">
      <div class="dlabel">要点</div>
      <ul class="dpoints" id="dPoints"></ul>
    </div>
    <div class="dsec">
      <div class="dlabel">简述 <em id="dRead"></em></div>
      <div class="dsummary" id="dSummary"></div>
    </div>
    <div class="dsource" id="dSource">
      <div class="dlabel">引用原文</div>
      <a class="src-link" id="dLink" target="_blank" rel="noreferrer">
        <span class="src-name" id="dLinkName"></span>
        <span class="src-go">打开 ↗</span>
      </a>
    </div>
  </div>

  <footer class="drawer-foot">
    <button class="btn" data-act="dPrev">← 上一条</button>
    <button class="btn" data-act="dNext">下一条 →</button>
    <span class="spacer"></span>
    <span class="drawer-prog" id="dProg"></span>
  </footer>
</aside>

<!-- ===================== 设置 ===================== -->
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3>设置</h3>
      <button class="btn ghost" data-act="closeModal">关闭</button>
    </div>
    <div class="modal-body">
      <!-- 内容由 app.js 按 /api/settings-schema 渲染 —— 加配置项只改
           app/settings_schema.py，不用动这个文件 -->
      <div id="cfgBody"></div>
      <div class="modal-note" id="cfgPath"></div>
    </div>
    <div class="modal-foot">
      <button class="btn primary" data-act="saveConfig">保存并重新生成</button>
      <span class="modal-msg" id="cfgMsg"></span>
    </div>
  </div>
</div>

<!-- ===================== 添加启动项：选文件 ===================== -->
<div class="modal" id="pickModal" hidden>
  <div class="modal-box pick-box">
    <div class="modal-head">
      <h3>添加启动项</h3>
      <button class="btn ghost" data-act="closePick">关闭</button>
    </div>
    <div class="pick-path" id="pickPath">选择位置</div>
    <div class="pick-quick" id="pickQuick" hidden></div>
    <div class="pick-list" id="pickList"></div>
    <div class="modal-foot pick-foot">
      <input id="pickManual" type="text" spellcheck="false"
             placeholder="也可以直接粘贴完整路径，例如 E:\某程序\某程序.exe">
      <button class="btn primary" data-act="pickManual">用这个路径</button>
      <span class="modal-msg" id="pickMsg"></span>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
